map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vnytros_api      { server 127.0.0.1:8000; keepalive 32; }
upstream vnytros_mcp      { server 127.0.0.1:5000; keepalive 16; }
upstream vnytros_rabbitmq { server 127.0.0.1:15672; keepalive 8; }
upstream vnytros_grafana  { server 127.0.0.1:3000; keepalive 8; }

# Real client IP behind the Cloudflare proxy. ONLY relevant if your hostnames
# are proxied through Cloudflare (orange cloud). Otherwise these lines are
# harmless — the header is trusted only from these ranges — and you may delete
# them. Behind Cloudflare, without this every request appears to come from
# Cloudflare, which breaks IP allowlists and makes the access logs useless.
# These are Cloudflare's published ranges; refresh them from
# https://www.cloudflare.com/ips-v4 and /ips-v6.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Unknown Host headers get nothing, rather than being served by whichever
# server block happens to be first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
