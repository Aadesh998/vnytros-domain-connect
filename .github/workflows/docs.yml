name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # audit:docs reads the server router, so route changes re-run it.
      - "server/internal/server/server.go"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "server/internal/server/server.go"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run audit:docs
